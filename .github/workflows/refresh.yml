name: Refresh scouting data

on:
  schedule:
    - cron: "17 5 * * *"     # daily, 05:17 UTC
  workflow_dispatch:          # run it by hand from the Actions tab

permissions:
  contents: write             # lets the job commit the refreshed data

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Tests
        run: python -m pytest -q

      # API-Football responses are cached between runs (NOT committed: raw API data stays out
      # of the repo) so the injury backfill resumes where the last night's budget ran out.
      - name: Restore API response cache
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-cache-${{ github.run_id }}
          restore-keys: raw-cache-

      - name: Refresh data (FPL stats, football-data.org, API-Football injuries, Transfermarkt file)
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python -m scouting refresh --source fpl --football-data --api-football

      - name: Commit refreshed data
        run: |
          git config user.name "scouting-bot"
          git config user.email "scouting-bot@users.noreply.github.com"
          git add data/processed
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore(data): refresh $(date -u +%F)"
            git push
          fi
